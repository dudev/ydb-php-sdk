name: tests

on:
  pull_request:
  push:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    services:
      ydb:
        image: ydbplatform/local-ydb:${{ matrix.ydb-versions }}
        ports:
          - 2135:2135
          - 2136:2136
          - 8765:8765
        volumes:
          - /tmp/ydb_certs:/ydb_certs
        options: '-h localhost'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '7.2', '7.4', '8.0', '8.2' ]
        # Switched from cr.yandex/yc/yandex-docker-local-ydb: its `latest` sits on a
        # year-old stable-24-3-11-hotfix-13 build and it stops at 25.2.1, while
        # ydbplatform/local-ydb (used by the Go/Python/Java/.NET/Rust/Node.js SDKs)
        # ships real numbered tags up to 26.x and an actually current `latest`.
        # Verified port/database layout (grpc :2136, tls :2135, mon :8765, db /local,
        # certs at /ydb_certs) matches this image's defaults, so no compose changes needed.
        ydb-versions: ['24.4', '25.4', 'latest', 'edge', 'trunk']
    env:
      YDB_VERSION: ${{ matrix.ydb-versions }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      # The grpc PHP extension installed by setup-php is self-contained (it bundles
      # grpc core), so no separate gRPC build from source is needed.
      - uses: shivammathur/setup-php@v2
        name: Setup PHP
        id: php
        with:
          extensions: grpc
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug

      - run: composer validate --strict
        name: Validate composer.json and composer.lock

      - uses: actions/cache@v4
        name: Cache Composer packages
        id: composer-cache

        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Show YDB version
        run: docker exec $(docker ps --latest --quiet) /ydbd -V

      - name: Create YDB User
        run: docker exec $(docker ps --latest --quiet) /ydb -e grpc://localhost:2136 -d /local scripting yql -s "CREATE USER testuser PASSWORD 'testpassword'"

      - name: Run tests
        run: |
          ./vendor/bin/phpunit \
            --coverage-text \
            --coverage-clover=coverage.xml \
            --whitelist src \
            --testdox \
            tests

      - name: Upload coverage to Codecov
        if: matrix.php-versions == '8.2' && matrix.ydb-versions == 'trunk'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
